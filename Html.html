<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Farm Island 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass: rgba(18, 54, 76, 0.56);
      --glass-light: rgba(255, 255, 255, 0.18);
      --line: rgba(255, 255, 255, 0.28);
      --yellow: #ffd95a;
      --green: #8fe05d;
      --blue: #66cfff;
      --red: #ff7777;
      --text: #fffdf6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #76cfee;
      color: var(--text);
      font-family: "Kanit", sans-serif;
    }

    canvas {
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      box-shadow: 0 10px 35px rgba(0, 30, 55, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      border-radius: 18px;
    }

    #hud {
      position: fixed;
      z-index: 10;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      max-width: min(680px, calc(100vw - 36px));
    }

    .hud-card {
      min-width: 144px;
      padding: 9px 14px;
    }

    .hud-label {
      display: block;
      font-size: 12px;
      color: #d7f4ff;
      opacity: 0.9;
      line-height: 1;
    }

    .hud-value {
      display: block;
      margin-top: 3px;
      font-size: 20px;
      font-weight: 700;
      color: #fff8cb;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
    }

    #right-panel {
      position: fixed;
      z-index: 10;
      top: 18px;
      right: 18px;
      width: min(270px, calc(100vw - 36px));
      padding: 14px;
    }

    #right-panel h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    #inventory {
      max-height: 150px;
      overflow-y: auto;
      font-size: 13px;
      color: #f6fbff;
    }

    .inventory-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 0;
    }

    .inventory-row:last-child {
      border-bottom: 0;
    }

    button {
      font-family: inherit;
      color: #173249;
      font-weight: 600;
      border: 0;
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      background: linear-gradient(180deg, #ffffff, #d8f5ff);
      box-shadow: 0 3px 0 rgba(21, 74, 91, 0.28);
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    button:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(21, 74, 91, 0.28);
    }

    button.selected {
      background: linear-gradient(180deg, #ffe99a, #ffc95d);
      color: #70430a;
    }

    button.danger {
      background: linear-gradient(180deg, #ffb2a5, #ff776b);
      color: #681e1a;
    }

    button.buy {
      width: 100%;
      margin-top: 7px;
      background: linear-gradient(180deg, #bffb98, #7bd75c);
      color: #164d24;
    }

    #sell-button {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(180deg, #ffe58c, #ffc94d);
      color: #714700;
    }

    #shop {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 20px;
      width: min(720px, calc(100vw - 36px));
      padding: 12px;
      transform: translateX(-50%);
    }

    #tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab {
      white-space: nowrap;
      padding: 7px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .tab.active {
      color: #16435a;
      background: #d6f5ff;
    }

    #shop-content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
      gap: 8px;
      max-height: 188px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .shop-item {
      min-height: 91px;
      padding: 9px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .shop-item strong {
      display: block;
      font-size: 14px;
    }

    .shop-item small {
      display: block;
      margin-top: 1px;
      line-height: 1.25;
      color: #dff8ff;
      font-size: 11px;
    }

    .shop-item .price {
      color: #fff0a6;
      font-weight: 600;
      margin-top: 4px;
    }

    #help {
      position: fixed;
      z-index: 9;
      left: 18px;
      bottom: 18px;
      padding: 9px 13px;
      font-size: 12px;
      color: #eafaff;
      pointer-events: none;
    }

    #robot-tag {
      position: fixed;
      z-index: 12;
      transform: translate(-50%, -120%);
      display: none;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(26, 70, 97, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.42);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    }

    #toast-layer {
      position: fixed;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .toast {
      position: absolute;
      transform: translate(-50%, 0);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.38);
      animation: float-up 1.25s ease-out forwards;
      white-space: nowrap;
    }

    .toast.good {
      color: #eaff9b;
    }

    .toast.bad {
      color: #ffb7ae;
    }

    .toast.info {
      color: #c8f1ff;
    }

    @keyframes float-up {
      0% {
        opacity: 0;
        transform: translate(-50%, 12px) scale(0.82);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -80px) scale(1.08);
      }
    }

    #modal-backdrop {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 30, 46, 0.48);
      backdrop-filter: blur(5px);
    }

    #modal-backdrop.show {
      display: flex;
    }

    #quiz-modal {
      width: min(410px, calc(100vw - 34px));
      padding: 22px;
      text-align: center;
      background: rgba(20, 64, 88, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 24px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.3);
    }

    #quiz-modal h2 {
      margin: 0;
      font-size: 22px;
    }

    #quiz-question {
      margin: 13px 0 18px;
      color: #fff2a7;
      font-size: 30px;
      font-weight: 700;
    }

    #answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    #answers button {
      padding: 13px;
      font-size: 18px;
    }

    #footer {
      position: fixed;
      z-index: 8;
      right: 18px;
      bottom: 14px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      #right-panel {
        top: 102px;
        width: 205px;
      }

      #help {
        display: none;
      }

      #shop {
        bottom: 10px;
      }

      #footer {
        display: none;
      }

      .hud-card {
        min-width: 126px;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="glass hud-card">
      <span class="hud-label">เหรียญ</span>
      <span class="hud-value" id="coins">🪙 100</span>
    </div>
    <div class="glass hud-card">
      <span class="hud-label">เกาะที่กำลังเล่น</span>
      <span class="hud-value" id="island-name">เกาะหลัก</span>
    </div>
    <div class="glass hud-card">
      <span class="hud-label">สถานะหุ่นยนต์</span>
      <span class="hud-value" id="buff-status">พร้อมทำควิซ</span>
    </div>
  </div>

  <div id="right-panel" class="glass">
    <h3>🎒 คลังสินค้า</h3>
    <div id="inventory"></div>
    <button id="sell-button">💰 ขายผลผลิตทั้งหมด</button>
  </div>

  <div id="shop" class="glass">
    <div id="tabs"></div>
    <div id="shop-content"></div>
  </div>

  <div id="help" class="glass">
    🖱️ ลากเพื่อหมุนกล้อง · หมุนล้อเพื่อซูม · คลิกแปลงเพื่อปลูก/เก็บเกี่ยว · คลิกหุ่นยนต์เพื่อทำควิซ
  </div>

  <div id="robot-tag">QUIZ 🤖</div>
  <div id="toast-layer"></div>

  <div id="modal-backdrop">
    <div id="quiz-modal">
      <h2>🤖 ควิซหุ่นยนต์ชาวสวน</h2>
      <div id="quiz-question">2 + 2 = ?</div>
      <div id="answers"></div>
    </div>
  </div>

  <div id="footer">Designed By “Sarayut”</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <script>
    (() => {
      const PLANTS = {
        tomato: {
          name: "มะเขือเทศ",
          icon: "🍅",
          cost: 10,
          sell: 15,
          grow: 30,
          color: 0xff3e42
        },
        carrot: {
          name: "แครอท",
          icon: "🥕",
          cost: 20,
          sell: 40,
          grow: 60,
          color: 0xff962d
        },
        cabbage: {
          name: "กะหล่ำปลี",
          icon: "🥬",
          cost: 50,
          sell: 150,
          grow: 120,
          color: 0x9eea73
        },
        strawberry: {
          name: "สตรอว์เบอร์รี",
          icon: "🍓",
          cost: 35,
          sell: 105,
          grow: 75,
          color: 0xff4f67
        },
        corn: {
          name: "ข้าวโพด",
          icon: "🌽",
          cost: 70,
          sell: 200,
          grow: 180,
          color: 0xffd84b
        },
        pumpkin: {
          name: "ฟักทอง",
          icon: "🎃",
          cost: 120,
          sell: 380,
          grow: 240,
          color: 0xff8b2d
        }
      };

      const PRODUCTS = {
        tomato: { name: "มะเขือเทศ", icon: "🍅", value: 15 },
        carrot: { name: "แครอท", icon: "🥕", value: 40 },
        cabbage: { name: "กะหล่ำปลี", icon: "🥬", value: 150 },
        strawberry: { name: "สตรอว์เบอร์รี", icon: "🍓", value: 105 },
        corn: { name: "ข้าวโพด", icon: "🌽", value: 200 },
        pumpkin: { name: "ฟักทอง", icon: "🎃", value: 380 },
        egg: { name: "ไข่ไก่", icon: "🥚", value: 250 },
        milk: { name: "นม 1 แกลลอน", icon: "🥛", value: 600 },
        pig: { name: "หมูโตเต็มวัย", icon: "🐖", value: 800 }
      };

      const ANIMALS = {
        chicken: { name: "ไก่", icon: "🐔", cost: 300, feed: "chickenFeed", production: 180, product: "egg" },
        cow: { name: "วัว", icon: "🐄", cost: 600, feed: "cowFeed", production: 300, product: "milk", birth: 600 },
        pig: { name: "หมู", icon: "🐷", cost: 800, feed: "pigFeed", production: 300, product: "pig", birth: 600 }
      };

      const ISLAND_OPTIONS = {
        S: { name: "เกาะขนาด S", price: 1500, radius: 8.2, color: 0xff8da1 },
        M: { name: "เกาะขนาด M", price: 3000, radius: 10.2, color: 0x7edcff },
        L: { name: "เกาะขนาด L", price: 5000, radius: 12.2, color: 0xb984ff }
      };

      const state = {
        coins: 100,
        selectedSeed: "tomato",
        activeIsland: 0,
        activeTab: "seeds",
        inventory: {
          tomato: 0,
          carrot: 0,
          cabbage: 0,
          strawberry: 0,
          corn: 0,
          pumpkin: 0,
          egg: 0,
          milk: 0,
          pig: 0
        },
        islands: [],
        bridges: [],
        treeObjects: [],
        smokeObjects: [],
        rainDrops: [],
        sparks: [],
        quizFarm: null,
        quizAnswer: null,
        pointerDown: { x: 0, y: 0 }
      };

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x78d7f3);
      scene.fog = new THREE.Fog(0x78d7f3, 42, 110);

      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 250);
      camera.position.set(17, 18, 24);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 12;
      controls.maxDistance = 48;
      controls.maxPolarAngle = Math.PI * 0.47;
      controls.target.set(0, 0, 0);

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const clock = new THREE.Clock();

      const hemi = new THREE.HemisphereLight(0xdff8ff, 0x426448, 1.25);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff1c5, 1.25);
      sun.position.set(16, 28, 14);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -34;
      sun.shadow.camera.right = 34;
      sun.shadow.camera.top = 34;
      sun.shadow.camera.bottom = -34;
      scene.add(sun);

      const ambientCloud = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
      );
      ambientCloud.position.set(-18, 20, -25);
      ambientCloud.scale.set(1.7, 0.55, 0.8);
      scene.add(ambientCloud);

      const seaGeometry = new THREE.PlaneGeometry(180, 180, 55, 55);
      seaGeometry.rotateX(-Math.PI / 2);
      const seaBase = seaGeometry.attributes.position.array.slice();
      const sea = new THREE.Mesh(
        seaGeometry,
        new THREE.MeshPhongMaterial({
          color: 0x3baed7,
          shininess: 80,
          specular: 0xa9f3ff,
          transparent: true,
          opacity: 0.92
        })
      );
      sea.position.y = -4.2;
      scene.add(sea);

      const world = new THREE.Group();
      scene.add(world);

      const mats = {
        grass: new THREE.MeshStandardMaterial({ color: 0x67c84f, roughness: 0.88 }),
        grassLight: new THREE.MeshStandardMaterial({ color: 0x83dd5c, roughness: 0.85 }),
        dirt: new THREE.MeshStandardMaterial({ color: 0x9a5731, roughness: 1 }),
        dirtLight: new THREE.MeshStandardMaterial({ color: 0xb86c3d, roughness: 1 }),
        sand: new THREE.MeshStandardMaterial({ color: 0xf4cd79, roughness: 0.95 }),
        trunk: new THREE.MeshStandardMaterial({ color: 0x754226, roughness: 1 }),
        leaf: new THREE.MeshStandardMaterial({ color: 0x3f9d4d, roughness: 0.9 }),
        leafLight: new THREE.MeshStandardMaterial({ color: 0x68c759, roughness: 0.9 }),
        stone: new THREE.MeshStandardMaterial({ color: 0x9bb6bd, roughness: 0.95 }),
        wood: new THREE.MeshStandardMaterial({ color: 0xb06a38, roughness: 0.9 }),
        roof: new THREE.MeshStandardMaterial({ color: 0xf16959, roughness: 0.85 }),
        wall: new THREE.MeshStandardMaterial({ color: 0xffedba, roughness: 0.95 }),
        water: new THREE.MeshStandardMaterial({ color: 0x43ccef, roughness: 0.5, transparent: true, opacity: 0.9 })
      };

      const ui = {
        coins: document.getElementById("coins"),
        islandName: document.getElementById("island-name"),
        buffStatus: document.getElementById("buff-status"),
        inventory: document.getElementById("inventory"),
        sell: document.getElementById("sell-button"),
        tabs: document.getElementById("tabs"),
        shop: document.getElementById("shop-content"),
        robotTag: document.getElementById("robot-tag"),
        toast: document.getElementById("toast-layer"),
        modal: document.getElementById("modal-backdrop"),
        question: document.getElementById("quiz-question"),
        answers: document.getElementById("answers")
      };

      let popSynth;
      let bellSynth;
      let failSynth;

      function initAudio() {
        if (!window.Tone) return;
        if (!popSynth) {
          popSynth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.12, sustain: 0.05, release: 0.2 }
          }).toDestination();

          bellSynth = new Tone.Synth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.25, sustain: 0.05, release: 0.8 }
          }).toDestination();

          failSynth = new Tone.Synth({
            oscillator: { type: "sawtooth" },
            envelope: { attack: 0.01, decay: 0.22, sustain: 0, release: 0.12 }
          }).toDestination();
        }
        Tone.start();
      }

      function sound(type) {
        initAudio();
        if (!popSynth) return;
        const now = Tone.now();
        if (type === "plant") {
          popSynth.triggerAttackRelease("C5", "16n", now);
          popSynth.triggerAttackRelease("E5", "16n", now + 0.08);
        }
        if (type === "harvest" || type === "money") {
          bellSynth.triggerAttackRelease("G5", "8n", now);
          bellSynth.triggerAttackRelease("C6", "8n", now + 0.12);
        }
        if (type === "wrong") {
          failSynth.triggerAttackRelease("C3", "8n", now);
        }
        if (type === "correct") {
          bellSynth.triggerAttackRelease("E5", "16n", now);
          bellSynth.triggerAttackRelease("G5", "16n", now + 0.1);
          bellSynth.triggerAttackRelease("C6", "8n", now + 0.2);
        }
      }

      function makeMesh(geometry, material, cast = true) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = cast;
        mesh.receiveShadow = true;
        return mesh;
      }

      function randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function createFarm(size = "M", position = new THREE.Vector3(0, 0, 0), index = 0) {
        const opt = ISLAND_OPTIONS[size];
        const plots = [];
        for (let i = 0; i < 20; i++) {
          plots.push({
            crop: null,
            mesh: null,
            cropGroup: null
          });
        }

        return {
          id: Date.now() + Math.random(),
          index,
          size,
          radius: opt.radius,
          position,
          group: new THREE.Group(),
          plots,
          unlocked: 6,
          houseLevel: 1,
          barn: false,
          feed: {
            chickenFeed: 0,
            cowFeed: 0,
            pigFeed: 0
          },
          animals: {
            chicken: [],
            cow: [],
            pig: []
          },
          robot: {
            mesh: null,
            waterUntil: 0,
            brokenUntil: 0,
            joyUntil: 0
          },
          plotMeshes: [],
          decorations: [],
          animalMeshes: [],
          islandMesh: null
        };
      }

      function getPlotPosition(index) {
        const col = index % 4;
        const row = Math.floor(index / 4);
        return new THREE.Vector3((col - 1.5) * 2.25, 0.49, (row - 2) * 2.08);
      }

      function addIslandBase(farm) {
        const g = farm.group;
        g.position.copy(farm.position);
        world.add(g);

        const radius = farm.radius;

        const lower = makeMesh(
          new THREE.ConeGeometry(radius * 0.88, 4.6, 14),
          mats.sand
        );
        lower.position.y = -2.05;
        lower.rotation.y = Math.PI / 14;
        g.add(lower);

        const dirtRim = makeMesh(
          new THREE.CylinderGeometry(radius * 0.98, radius * 0.93, 0.53, 16),
          mats.dirtLight
        );
        dirtRim.position.y = -0.05;
        g.add(dirtRim);

        const lawn = makeMesh(
          new THREE.CylinderGeometry(radius, radius * 0.98, 0.5, 16),
          mats.grass
        );
        lawn.position.y = 0.34;
        g.add(lawn);
        farm.islandMesh = lawn;
        lawn.userData = { kind: "island", farm };

        const shore = makeMesh(
          new THREE.TorusGeometry(radius * 0.99, 0.13, 6, 20),
          new THREE.MeshStandardMaterial({ color: 0xf7d986, roughness: 0.92 })
        );
        shore.position.y = 0.62;
        shore.rotation.x = Math.PI / 2;
        g.add(shore);

        const pebbleMaterial = new THREE.MeshStandardMaterial({ color: 0xe5c879, roughness: 1 });
        for (let i = 0; i < 14; i++) {
          const a = (Math.PI * 2 * i) / 14 + 0.2;
          const r = radius * randomRange(0.73, 0.9);
          const pebble = makeMesh(new THREE.DodecahedronGeometry(randomRange(0.11, 0.24), 0), pebbleMaterial);
          pebble.position.set(Math.cos(a) * r, 0.68, Math.sin(a) * r);
          pebble.rotation.set(Math.random(), Math.random(), Math.random());
          g.add(pebble);
        }
      }

      function createTree(x, z, scale = 1) {
        const tree = new THREE.Group();
        const trunk = makeMesh(new THREE.CylinderGeometry(0.15 * scale, 0.21 * scale, 1.1 * scale, 7), mats.trunk);
        trunk.position.y = 0.55 * scale;
        tree.add(trunk);

        const foliageA = makeMesh(new THREE.ConeGeometry(0.82 * scale, 1.35 * scale, 7), mats.leaf);
        foliageA.position.y = 1.4 * scale;
        tree.add(foliageA);

        const foliageB = makeMesh(new THREE.ConeGeometry(0.59 * scale, 1.12 * scale, 7), mats.leafLight);
        foliageB.position.y = 2.04 * scale;
        tree.add(foliageB);

        tree.position.set(x, 0.6, z);
        tree.userData.windPhase = Math.random() * Math.PI * 2;
        state.treeObjects.push(tree);
        return tree;
      }

      function addTrees(farm) {
        const r = farm.radius * 0.78;
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2 + 0.2;
          const tree = createTree(Math.cos(a) * r, Math.sin(a) * r, randomRange(0.72, 1.04));
          farm.group.add(tree);
          farm.decorations.push(tree);
        }

        const flowers = new THREE.Group();
        for (let i = 0; i < 16; i++) {
          const flower = makeMesh(
            new THREE.SphereGeometry(0.07, 6, 6),
            new THREE.MeshStandardMaterial({ color: i % 2 ? 0xffe35f : 0xff9fbf })
          );
          flower.position.set(randomRange(-farm.radius * 0.7, farm.radius * 0.7), 0.64, randomRange(-farm.radius * 0.7, farm.radius * 0.7));
          if (flower.position.length() > farm.radius * 0.72) continue;
          flowers.add(flower);
        }
        farm.group.add(flowers);
      }

      function addHouse(farm) {
        const level = farm.houseLevel;
        const house = new THREE.Group();
        const width = 2.1 + level * 0.32;
        const height = 1.55 + level * 0.18;
        const depth = 1.75 + level * 0.18;

        const base = makeMesh(new THREE.BoxGeometry(width, height, depth), mats.wall);
        base.position.y = 0.6 + height / 2;
        house.add(base);

        const roof = makeMesh(new THREE.ConeGeometry(width * 0.98, 1.18 + level * 0.08, 4), mats.roof);
        roof.position.y = 0.6 + height + 0.55;
        roof.rotation.y = Math.PI / 4;
        house.add(roof);

        const door = makeMesh(
          new THREE.BoxGeometry(0.42, 0.74, 0.05),
          new THREE.MeshStandardMaterial({ color: 0x864c2b })
        );
        door.position.set(0, 0.97, depth / 2 + 0.03);
        house.add(door);

        const windowMat = new THREE.MeshStandardMaterial({
          color: 0x7de6ff,
          emissive: 0x25586f,
          emissiveIntensity: 0.35
        });

        for (const x of [-width * 0.28, width * 0.28]) {
          const win = makeMesh(new THREE.BoxGeometry(0.38, 0.36, 0.05), windowMat);
          win.position.set(x, 1.4, depth / 2 + 0.035);
          house.add(win);
        }

        const chimney = makeMesh(new THREE.BoxGeometry(0.3, 0.92, 0.3), mats.dirt);
        chimney.position.set(width * 0.3, 0.6 + height + 0.62, 0);
        house.add(chimney);

        if (level >= 2) {
          const sideRoom = makeMesh(new THREE.BoxGeometry(1.18, 1.12, 1.2), mats.wall);
          sideRoom.position.set(width * 0.62, 1.16, 0.15);
          house.add(sideRoom);
        }

        if (level >= 3) {
          const balcony = makeMesh(new THREE.BoxGeometry(1.3, 0.1, 0.55), mats.wood);
          balcony.position.set(-width * 0.48, 1.95, depth * 0.56);
          house.add(balcony);
        }

        if (level >= 4) {
          const flagPole = makeMesh(new THREE.CylinderGeometry(0.025, 0.025, 1.45, 6), mats.stone);
          flagPole.position.set(-width * 0.53, 2.7, 0);
          house.add(flagPole);

          const flag = makeMesh(
            new THREE.BoxGeometry(0.65, 0.36, 0.04),
            new THREE.MeshStandardMaterial({ color: 0xffdc4e })
          );
          flag.position.set(-width * 0.25, 3.13, 0);
          house.add(flag);
        }

        if (level >= 5) {
          const tower = makeMesh(new THREE.CylinderGeometry(0.58, 0.68, 2.1, 8), mats.wall);
          tower.position.set(-width * 0.62, 1.65, -depth * 0.2);
          house.add(tower);

          const towerRoof = makeMesh(new THREE.ConeGeometry(0.76, 0.95, 8), mats.roof);
          towerRoof.position.set(-width * 0.62, 3.18, -depth * 0.2);
          house.add(towerRoof);
        }

        house.position.set(farm.radius * 0.48, 0, farm.radius * 0.36);
        house.rotation.y = -0.45;
        farm.group.add(house);

        for (let i = 0; i < 6; i++) {
          const smoke = makeMesh(
            new THREE.SphereGeometry(0.16 + i * 0.018, 8, 8),
            new THREE.MeshStandardMaterial({
              color: 0xf4f4f1,
              transparent: true,
              opacity: 0.62
            }),
            false
          );
          smoke.position.copy(house.position).add(new THREE.Vector3(width * 0.3, 0.6 + height + 1.15 + i * 0.22, 0));
          smoke.userData = {
            base: smoke.position.clone(),
            phase: i * 0.6 + Math.random() * 2,
            farm
          };
          farm.group.add(smoke);
          state.smokeObjects.push(smoke);
        }
      }

      function addWell(farm) {
        const well = new THREE.Group();
        const wall = makeMesh(new THREE.CylinderGeometry(0.68, 0.75, 0.56, 10), mats.stone);
        wall.position.y = 0.86;
        well.add(wall);

        const water = makeMesh(new THREE.CylinderGeometry(0.52, 0.52, 0.04, 16), mats.water);
        water.position.y = 1.16;
        well.add(water);

        const postMat = mats.wood;
        for (const x of [-0.58, 0.58]) {
          const post = makeMesh(new THREE.BoxGeometry(0.12, 1.36, 0.12), postMat);

          well.add(post);
        }

        roof.rotation.y = Math.PI / 4;

        well.position.set(farm.radius * 0.55, 0, -farm.radius * 0.3);

      function addRobot(farm) {

        robot.add(body);

        for (const x of [-0.32, 0.32]) {

          const arm = makeMesh(new THREE.BoxGeometry(0.15, 0.58, 0.15), mats.stone);

      function addPlots(farm) {
        const plotGeo = new THREE.BoxGeometry(1.75, 0.18, 1.6);

        for (let i = 0; i < farm.unlocked; i++) {
          const pos = getPlotPosition(i);
          const plot = makeMesh(plotGeo, mats.dirt);
          plot.position.copy(pos);
          plot.position.y = 0.69;
          plot.userData = { kind: "plot", farm, index: i };
          farm.group.add(plot);
          farm.plots[i].mesh = plot;
          farm.plotMeshes.push(plot);

          const border = makeMesh(
            new THREE.BoxGeometry(1.9, 0.09, 1.75),
            new THREE.MeshStandardMaterial({ color: 0xd28a4c, roughness: 1 })
          );
          border.position.copy(pos);
          border.position.y = 0.61;
          farm.group.add(border);

          if (farm.plots[i].crop) {
            createCropVisual(farm, i);
          }
        }
      }

      function createCropVisual(farm, index) {
        const plotData = farm.plots[index];
        if (!plotData.crop || plotData.cropGroup) return;

        const plant = PLANTS[plotData.crop.type];
        const group = new THREE.Group();
        const p = getPlotPosition(index);
        group.position.set(p.x, 0.77, p.z);

        const stemMat = new THREE.MeshStandardMaterial({ color: 0x3f9c47, roughness: 0.9 });
        const stem = makeMesh(new THREE.CylinderGeometry(0.06, 0.08, 0.72, 6), stemMat);
        stem.position.y = 0.35;
        group.add(stem);

        const leafMat = new THREE.MeshStandardMaterial({ color: 0x55b949, roughness: 0.9 });

        function leaf(x, z, rot) {
          const l = makeMesh(new THREE.SphereGeometry(0.23, 7, 6), leafMat);
          l.scale.set(1.35, 0.32, 0.72);
          l.position.set(x, 0.46, z);
          l.rotation.y = rot;
          group.add(l);
        }

        if (plant === PLANTS.carrot) {
          const root = makeMesh(
            new THREE.ConeGeometry(0.32, 0.78, 8),
            new THREE.MeshStandardMaterial({ color: plant.color, roughness: 0.8 })
          );
          root.position.y = 0.38;
          root.rotation.x = Math.PI;
          group.add(root);
          for (let n = 0; n < 5; n++) {
            const green = makeMesh(new THREE.BoxGeometry(0.1, 0.55, 0.1), leafMat);
            green.position.set(Math.cos(n) * 0.12, 0.79, Math.sin(n) * 0.12);
            green.rotation.z = Math.cos(n) * 0.55;
            group.add(green);
          }
        } else if (plant === PLANTS.cabbage) {
          const cabbage = makeMesh(
            new THREE.DodecahedronGeometry(0.53, 1),
            new THREE.MeshStandardMaterial({ color: plant.color, roughness: 0.92 })
          );
          cabbage.position.y = 0.48;
          group.add(cabbage);
          for (let n = 0; n < 5; n++) leaf(Math.cos(n) * 0.35, Math.sin(n) * 0.35, n);
        } else if (plant === PLANTS.corn) {
          const stalk = makeMesh(
            new THREE.CylinderGeometry(0.09, 0.12, 1.25, 7),
            new THREE.MeshStandardMaterial({ color: 0x55a844, roughness: 0.9 })
          );
          stalk.position.y = 0.56;
          group.add(stalk);
          for (let n = 0; n < 3; n++) {
            const cornLeaf = makeMesh(new THREE.ConeGeometry(0.22, 0.84, 4), leafMat);
            cornLeaf.position.set(n === 0 ? 0.18 : -0.18, 0.55 + n * 0.22, 0);
            cornLeaf.rotation.z = n === 0 ? Math.PI / 2 : -Math.PI / 2;
            group.add(cornLeaf);
          }
          const corn = makeMesh(
            new THREE.CylinderGeometry(0.17, 0.17, 0.52, 8),
            new THREE.MeshStandardMaterial({ color: 0xffd950, roughness: 0.8 })
          );
          corn.position.set(0.13, 0.88, 0);
          corn.rotation.z = 0.35;
          group.add(corn);
        } else if (plant === PLANTS.pumpkin) {
          const pumpkin = makeMesh(
            new THREE.SphereGeometry(0.52, 12, 8),
            new THREE.MeshStandardMaterial({ color: plant.color, roughness: 0.82 })
          );
          pumpkin.scale.set(1.12, 0.78, 1);
          pumpkin.position.y = 0.4;
          group.add(pumpkin);
          for (let n = 0; n < 5; n++) leaf(Math.cos(n) * 0.38, Math.sin(n) * 0.38, n);
        } else {
          for (let n = 0; n < 4; n++) leaf(Math.cos(n * 1.57) * 0.25, Math.sin(n * 1.57) * 0.25, n);
          const fruitCount = plant === PLANTS.strawberry ? 4 : 3;
          for (let n = 0; n < fruitCount; n++) {
            const fruit = makeMesh(
              new THREE.SphereGeometry(plant === PLANTS.strawberry ? 0.2 : 0.26, 9, 7),
              new THREE.MeshStandardMaterial({ color: plant.color, roughness: 0.72 })
            );
            fruit.position.set(Math.cos(n * 2.1) * 0.28, 0.62 + (n % 2) * 0.12, Math.sin(n * 2.1) * 0.25);
            fruit.scale.y = plant === PLANTS.strawberry ? 1.2 : 1;
            group.add(fruit);
          }
        }

        const bar = new THREE.Group();
        bar.position.y = 1.5;
        const back = makeMesh(
          new THREE.PlaneGeometry(0.98, 0.14),
          new THREE.MeshBasicMaterial({ color: 0x263c51, transparent: true, opacity: 0.85 }),
          false
        );
        bar.add(back);

        const fill = makeMesh(
          new THREE.PlaneGeometry(0.9, 0.08),
          new THREE.MeshBasicMaterial({ color: 0xaaff67 }),
          false
        );
        fill.position.z = 0.01;
        bar.add(fill);
        group.add(bar);

        group.userData = { bar, fill, index, crop: plotData.crop };
        group.scale.setScalar(0.12);
        farm.group.add(group);
        plotData.cropGroup = group;
      }

      function addBarn(farm) {
        if (!farm.barn) return;

        const pen = new THREE.Group();
        const px = -farm.radius * 0.37;
        const pz = farm.radius * 0.38;

        const floor = makeMesh(
          new THREE.BoxGeometry(4.4, 0.12, 3.55),
          new THREE.MeshStandardMaterial({ color: 0xe6bd74, roughness: 1 })
        );
        floor.position.set(px, 0.71, pz);
        pen.add(floor);

        const fenceMat = new THREE.MeshStandardMaterial({ color: 0xa76637, roughness: 0.9 });
        const fence = (x, z, w, d) => {
          const rail1 = makeMesh(new THREE.BoxGeometry(w, 0.09, d), fenceMat);
          rail1.position.set(px + x, 1.05, pz + z);
          pen.add(rail1);
          const rail2 = makeMesh(new THREE.BoxGeometry(w, 0.09, d), fenceMat);
          rail2.position.set(px + x, 1.43, pz + z);
          pen.add(rail2);
        };

        fence(0, -1.7, 4.5, 0.1);
        fence(0, 1.7, 4.5, 0.1);
        fence(-2.2, 0, 0.1, 3.5);
        fence(2.2, 0, 0.1, 3.5);

        for (const x of [-2.15, 2.15]) {
          for (const z of [-1.65, 1.65]) {
            const post = makeMesh(new THREE.BoxGeometry(0.12, 1.1, 0.12), fenceMat);
            post.position.set(px + x, 1.25, pz + z);
            pen.add(post);
          }
        }

        const barnHouse = makeMesh(new THREE.BoxGeometry(1.4, 1.2, 1.05), mats.wall);
        barnHouse.position.set(px + 1.32, 1.32, pz - 0.95);
        pen.add(barnHouse);

        const barnRoof = makeMesh(new THREE.ConeGeometry(1.12, 0.7, 4), mats.roof);
        barnRoof.position.set(px + 1.32, 2.3, pz - 0.95);
        barnRoof.rotation.y = Math.PI / 4;
        pen.add(barnRoof);

        farm.group.add(pen);

        ["chicken", "cow", "pig"].forEach((type, typeIndex) => {
          farm.animals[type].slice(0, 8).forEach((animal, animalIndex) => {
            const animalMesh = createAnimalMesh(type);
            const x = px - 1.35 + (animalIndex % 3) * 0.82;
            const z = pz - 0.75 + typeIndex * 0.8 + Math.floor(animalIndex / 3) * 0.18;
            animalMesh.position.set(x, 0.8, z);
            animalMesh.userData = { animal, phase: Math.random() * 6 };
            pen.add(animalMesh);
            farm.animalMeshes.push(animalMesh);
          });
        });
      }

      function createAnimalMesh(type) {
        const group = new THREE.Group();
        let color = 0xffffff;
        if (type === "chicken") color = 0xfffbdf;
        if (type === "cow") color = 0xf2f3ef;
        if (type === "pig") color = 0xffa7aa;

        const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.86 });
        const body = makeMesh(new THREE.SphereGeometry(type === "cow" ? 0.42 : 0.32, 10, 8), bodyMat);
        body.scale.set(type === "cow" ? 1.3 : 1, 0.82, 1);
        body.position.y = 0.34;
        group.add(body);

        const head = makeMesh(new THREE.SphereGeometry(type === "cow" ? 0.25 : 0.2, 9, 8), bodyMat);
        head.position.set(type === "chicken" ? 0.12 : 0.32, 0.55, 0);
        group.add(head);

        if (type === "chicken") {
          const beak = makeMesh(new THREE.ConeGeometry(0.08, 0.18, 4), new THREE.MeshStandardMaterial({ color: 0xffbc40 }));
          beak.position.set(0.28, 0.53, 0);
          beak.rotation.z = -Math.PI / 2;
          group.add(beak);

          const comb = makeMesh(new THREE.SphereGeometry(0.07, 7, 7), new THREE.MeshStandardMaterial({ color: 0xf04f55 }));
          comb.position.set(0.12, 0.78, 0);
          group.add(comb);
        }

        if (type === "cow") {
          const spotMat = new THREE.MeshStandardMaterial({ color: 0x493b38 });
          for (const pos of [[-0.15, 0.45, 0.34], [0.15, 0.37, -0.35]]) {
            const spot = makeMesh(new THREE.SphereGeometry(0.11, 7, 7), spotMat);
            spot.position.set(...pos);
            group.add(spot);
          }
        }

        if (type === "pig") {
          const snout = makeMesh(new THREE.CylinderGeometry(0.11, 0.11, 0.08, 8), new THREE.MeshStandardMaterial({ color: 0xf48191 }));
          snout.position.set(0.45, 0.47, 0);
          snout.rotation.z = Math.PI / 2;
          group.add(snout);
        }

        for (const x of [-0.16, 0.16]) {
          for (const z of [-0.16, 0.16]) {
            const leg = makeMesh(new THREE.CylinderGeometry(0.045, 0.05, 0.27, 6), bodyMat);
            leg.position.set(x, 0.14, z);
            group.add(leg);
          }
        }

        return group;
      }

      function rebuildFarm(farm) {
        state.treeObjects = state.treeObjects.filter(obj => !farm.group.children.includes(obj));
        state.smokeObjects = state.smokeObjects.filter(obj => !farm.group.children.includes(obj));
        world.remove(farm.group);
        farm.group = new THREE.Group();
        farm.plotMeshes = [];
        farm.decorations = [];
        farm.animalMeshes = [];
        farm.robot.mesh = null;

        for (const plot of farm.plots) {
          plot.mesh = null;
          plot.cropGroup = null;
        }

        addIslandBase(farm);
        addTrees(farm);
        addPlots(farm);
        addHouse(farm);
        addWell(farm);
        addRobot(farm);
        addBarn(farm);
      }

      function createBridge(fromFarm, toFarm, color) {
        const a = fromFarm.position.clone();
        const b = toFarm.position.clone();
        const mid = a.clone().add(b).multiplyScalar(0.5);
        const distance = a.distanceTo(b);
        const bridge = new THREE.Group();

        const deck = makeMesh(
          new THREE.BoxGeometry(distance - fromFarm.radius * 0.5 - toFarm.radius * 0.5, 0.22, 1.05),
          new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
        );
        deck.position.y = 0.78;
        bridge.add(deck);

        const railMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75 });
        for (const z of [-0.48, 0.48]) {
          const rail = makeMesh(new THREE.BoxGeometry(deck.geometry.parameters.width, 0.08, 0.07), railMat);
          rail.position.set(0, 1.22, z);
          bridge.add(rail);
        }

        bridge.position.copy(mid);
        bridge.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
        world.add(bridge);
        state.bridges.push(bridge);
      }

      function addFarmToWorld(farm) {
        rebuildFarm(farm);
      }

      function initialWorld() {
        const starter = createFarm("M", new THREE.Vector3(0, 0, 0), 0);
        state.islands.push(starter);
        addFarmToWorld(starter);
      }

      function currentFarm() {
        return state.islands[state.activeIsland];
      }

      function moneyEnough(amount) {
        if (state.coins < amount) {
          floatingText("เหรียญไม่พอ!", window.innerWidth / 2, window.innerHeight * 0.42, "bad");
          sound("wrong");
          return false;
        }
        return true;
      }

      function changeCoins(amount, x = window.innerWidth / 2, y = window.innerHeight * 0.42) {
        state.coins += amount;
        state.coins = Math.max(0, state.coins);
        floatingText(`${amount >= 0 ? "+" : ""}${amount} 🪙`, x, y, amount >= 0 ? "good" : "bad");
        sound(amount >= 0 ? "money" : "plant");
        updateUI();
      }

      function floatingText(text, x, y, type = "info") {
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = text;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        ui.toast.appendChild(el);
        setTimeout(() => el.remove(), 1300);
      }

      function plantCrop(farm, index, clientX, clientY) {
        const plot = farm.plots[index];
        if (plot.crop) return;

        const seed = PLANTS[state.selectedSeed];
        if (!moneyEnough(seed.cost)) return;

        state.coins -= seed.cost;
        plot.crop = {
          type: state.selectedSeed,
          elapsed: 0,
          ready: false,
          bounce: 0
        };
        createCropVisual(farm, index);
        sound("plant");
        floatingText(`-${seed.cost} 🪙 ${seed.icon}`, clientX, clientY, "bad");
        updateUI();
      }

      function harvestCrop(farm, index, clientX, clientY) {
        const plot = farm.plots[index];
        if (!plot.crop || !plot.crop.ready) return;

        const type = plot.crop.type;
        state.inventory[type] += 1;
        farm.group.remove(plot.cropGroup);
        plot.crop = null;
        plot.cropGroup = null;
        sound("harvest");
        floatingText(`+1 ${PLANTS[type].icon}`, clientX, clientY, "good");
        updateUI();
      }

      function sellEverything() {
        let earnings = 0;
        let count = 0;

        Object.keys(state.inventory).forEach(key => {
          const qty = state.inventory[key];
          if (qty > 0) {
            earnings += qty * PRODUCTS[key].value;
            count += qty;
            state.inventory[key] = 0;
          }
        });

        if (!earnings) {
          floatingText("ยังไม่มีผลผลิตให้ขาย", window.innerWidth / 2, window.innerHeight * 0.4, "info");
          sound("wrong");
          return;
        }

        state.coins += earnings;
        sound("money");
        floatingText(`ขาย ${count} ชิ้น +${earnings} 🪙`, window.innerWidth / 2, window.innerHeight * 0.36, "good");
        updateUI();
      }

      function buyPlot() {
        const farm = currentFarm();
        if (farm.unlocked >= 20) {
          floatingText("แปลงผักเต็ม 20 ช่องแล้ว", window.innerWidth / 2, window.innerHeight * 0.42, "info");
          return;
        }
        if (!moneyEnough(200)) return;
        state.coins -= 200;
        farm.unlocked++;

      }

      function upgradeHouse() {
        const farm = currentFarm();
        const prices = { 1: 300, 2: 800, 3: 1300, 4: 2000 };
        if (farm.houseLevel >= 5) {

        const farm = currentFarm();
        if (farm.barn) {
          floatingText("มีโรงเลี้ยงสัตว์แล้ว", window.innerWidth / 2, window.innerHeight * 0.42, "info");

        }

      function islandPositionFor(index) {
        const ring = Math.ceil(index / 6);
        const around = 6;
        const slot = (index - 1) % around;
        const angle = (slot / around) * Math.PI * 2 + 0.12;
        const radius = 22 + (ring - 1) * 20;
        return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      }

      function buyIsland(size) {
        if (state.islands.length >= 12) {
          floatingText("ซื้อเกาะได้สูงสุด 12 เกาะ", window.innerWidth / 2, window.innerHeight * 0.42, "info");
          return;
        }

        const option = ISLAND_OPTIONS[size];
        if (!moneyEnough(option.price)) return;

        state.coins -= option.price;
        const index = state.islands.length;
        const pos = islandPositionFor(index);
        const farm = createFarm(size, pos, index);
        state.islands.push(farm);
        addFarmToWorld(farm);

        const from = state.islands[0];
        createBridge(from, farm, option.color);

        state.activeIsland = index;
        controls.target.copy(pos);
        camera.position.copy(pos.clone().add(new THREE.Vector3(17, 18, 24)));
        sound("correct");
        floatingText(`ย้ายสู่ ${option.name}! 🏝️`, window.innerWidth / 2, window.innerHeight * 0.42, "good");
        updateUI();
      }

        if (!moneyEnough(price)) return;
        state.coins -= price;
        farm.feed[type] += 10;
        sound("money");
        floatingText(`+10 ถุงอาหาร`, window.innerWidth / 2, window.innerHeight * 0.42, "good");
        updateUI();

      function askQuiz(farm) {
        const now = performance.now();
        if (farm.robot.brokenUntil > now) {
          floatingText("หุ่นยนต์กำลังซ่อมตัวเองอยู่!", window.innerWidth / 2, window.innerHeight * 0.38, "bad");
          sound("wrong");
          return;
        }

        initAudio();
        let a = Math.floor(randomRange(3, 15));
        let b = Math.floor(randomRange(2, 12));
        const ops = ["+", "-", "×"];
        const op = ops[Math.floor(Math.random() * ops.length)];

        if (op === "-") {
          if (b > a) [a, b] = [b, a];
        }

        if (op === "×") {
          a = Math.floor(randomRange(2, 10));
          b = Math.floor(randomRange(2, 10));
        }

        let answer = 0;
        if (op === "+") answer = a + b;
        if (op === "-") answer = a - b;
        if (op === "×") answer = a * b;

        const choices = new Set([answer]);
        while (choices.size < 4) {
          const diff = Math.floor(randomRange(-11, 12)) || 3;
          const value = Math.max(0, answer + diff);
          choices.add(value);
        }

        const shuffled = Array.from(choices).sort(() => Math.random() - 0.5);
        state.quizFarm = farm;
        state.quizAnswer = answer;
        ui.question.textContent = `${a} ${op} ${b} = ?`;
        ui.answers.innerHTML = "";

        shuffled.forEach(value => {
          const btn = document.createElement("button");
          btn.textContent = value;
          btn.addEventListener("click", () => answerQuiz(value));
          ui.answers.appendChild(btn);
        });

        ui.modal.classList.add("show");
      }

      function answerQuiz(value) {
        const farm = state.quizFarm;
        if (!farm) return;

        ui.modal.classList.remove("show");
        const now = performance.now();

        if (value === state.quizAnswer) {
          farm.robot.waterUntil = now + 10000;
          farm.robot.joyUntil = now + 1000;
          createRain(farm);
          sound("correct");
          floatingText("ตอบถูก! รดน้ำเร่งโต 10 วินาที 💦", window.innerWidth / 2, window.innerHeight * 0.32, "good");
        } else {
          farm.robot.brokenUntil = now + 10000;
          createSparks(farm);
          sound("wrong");
          floatingText("ตอบผิด! หุ่นยนต์พัง 10 วินาที ⚡", window.innerWidth / 2, window.innerHeight * 0.32, "bad");
        }

        state.quizFarm = null;
        state.quizAnswer = null;
        updateUI();
      }

      function createRain(farm) {
        for (let i = 0; i < 90; i++) {
          const plot = getPlotPosition(i % farm.unlocked);
          const drop = makeMesh(
            new THREE.SphereGeometry(0.035, 5, 5),
            new THREE.MeshBasicMaterial({ color: 0x93edff, transparent: true, opacity: 0.9 }),
            false
          );
          drop.position.set(
            farm.position.x + plot.x + randomRange(-0.8, 0.8),
            randomRange(2.5, 6),
            farm.position.z + plot.z + randomRange(-0.7, 0.7)
          );
          scene.add(drop);
          state.rainDrops.push({
            mesh: drop,
            farm,
            speed: randomRange(3, 6),
            life: randomRange(1, 2.2)
          });
        }
      }

      function createSparks(farm) {
        const robotPos = new THREE.Vector3();
        farm.robot.mesh.getWorldPosition(robotPos);

        for (let i = 0; i < 36; i++) {
          const spark = makeMesh(
            new THREE.SphereGeometry(0.055, 6, 6),
            new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffe85b : 0xff7d4d }),
            false
          );
          spark.position.copy(robotPos).add(new THREE.Vector3(randomRange(-0.25, 0.25), randomRange(0.4, 1.4), randomRange(-0.25, 0.25)));
          scene.add(spark);
          state.sparks.push({
            mesh: spark,
            velocity: new THREE.Vector3(randomRange(-2, 2), randomRange(2, 5), randomRange(-2, 2)),
            life: randomRange(0.6, 1.3)
          });
        }
      }

      function updateFarm(farm, dt, elapsed) {
        const now = performance.now();
        const watered = farm.robot.waterUntil > now;
        const broken = farm.robot.brokenUntil > now;
        const growthRate = watered ? 1.5 : 1;

        farm.plots.forEach((plot, index) => {
          if (!plot.crop) return;

          const crop = plot.crop;
          if (!crop.ready) {
            crop.elapsed += dt * growthRate;
            const plant = PLANTS[crop.type];
            const progress = Math.min(crop.elapsed / plant.grow, 1);

            if (plot.cropGroup) {
              plot.cropGroup.scale.setScalar(0.18 + progress * 0.82);
              plot.cropGroup.userData.fill.scale.x = progress;
              plot.cropGroup.userData.fill.position.x = -(1 - progress) * 0.45;
              plot.cropGroup.userData.bar.visible = !crop.ready;
              plot.cropGroup.userData.bar.lookAt(camera.position);
            }

            if (progress >= 1) {
              crop.ready = true;
              crop.bounce = 0;
              if (plot.cropGroup) plot.cropGroup.userData.bar.visible = false;
              if (farm === currentFarm()) {
                floatingText(`โตแล้ว! ${plant.icon}`, window.innerWidth / 2, window.innerHeight * 0.45, "good");
              }
            }
          } else if (plot.cropGroup) {
            crop.bounce += dt;
            const s = 1 + Math.sin(crop.bounce * 5) * 0.08;
            plot.cropGroup.scale.setScalar(s);
          }
        });

        if (farm.robot.mesh) {
          if (broken) {
            farm.robot.mesh.rotation.z = Math.sin(elapsed * 34) * 0.18;
            farm.robot.mesh.rotation.y = Math.sin(elapsed * 27) * 0.15;
          } else {
            farm.robot.mesh.rotation.z = 0;
            farm.robot.mesh.rotation.y += farm.robot.joyUntil > now ? dt * 8 : Math.sin(elapsed * 1.7) * 0.002;
          }
        }

        Object.entries(ANIMALS).forEach(([type, info]) => {
          farm.animals[type].forEach(animal => {
            if (animal.food <= 0) return;
            animal.productionElapsed += dt;
            animal.birthElapsed += dt;

            if (animal.productionElapsed >= info.production) {
              animal.productionElapsed = 0;
              animal.food--;
              if (type === "pig") {
                animal.readyToSell = true;
              } else {
                state.inventory[info.product]++;
                if (farm === currentFarm()) {
                  floatingText(`ผลิต ${PRODUCTS[info.product].icon} สำเร็จ!`, window.innerWidth / 2, window.innerHeight * 0.44, "good");
                }
              }
            }

            if (info.birth && animal.birthElapsed >= info.birth) {
              animal.birthElapsed = 0;
              if (farm.animals[type].length < 12) {
                farm.animals[type].push({
                  food: 0,
                  productionElapsed: 0,
                  birthElapsed: 0,
                  readyToSell: false
                });
                rebuildFarm(farm);
                if (farm === currentFarm()) {
                  floatingText(`${info.icon} ออกลูกแล้ว!`, window.innerWidth / 2, window.innerHeight * 0.44, "good");
                }
              }
            }
          });
        });

        farm.animalMeshes.forEach(mesh => {
          mesh.position.y = 0.8 + Math.sin(elapsed * 3 + mesh.userData.phase) * 0.025;
          mesh.rotation.y = Math.sin(elapsed * 1.7 + mesh.userData.phase) * 0.17;
        });
      }

      function updateWaterAndEffects(dt, elapsed) {
        const pos = seaGeometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = seaBase[i * 3];
          const z = seaBase[i * 3 + 2];
          pos.array[i * 3 + 1] = Math.sin(x * 0.18 + elapsed * 1.4) * 0.18 + Math.cos(z * 0.22 + elapsed * 1.1) * 0.13;
        }
        pos.needsUpdate = true;
        seaGeometry.computeVertexNormals();

        state.treeObjects.forEach(tree => {
          tree.rotation.z = Math.sin(elapsed * 1.25 + tree.userData.windPhase) * 0.045;
          tree.rotation.x = Math.cos(elapsed * 1.05 + tree.userData.windPhase) * 0.018;
        });

        state.smokeObjects.forEach(smoke => {
          const p = smoke.userData.phase;
          smoke.position.x = smoke.userData.base.x + Math.sin(elapsed * 0.7 + p) * 0.22;
          smoke.position.y = smoke.userData.base.y + ((elapsed * 0.38 + p) % 1.8);
          smoke.scale.setScalar(0.8 + ((elapsed * 0.38 + p) % 1.8) * 0.55);
          smoke.material.opacity = Math.max(0.08, 0.55 - ((elapsed * 0.38 + p) % 1.8) * 0.2);
        });

        state.rainDrops = state.rainDrops.filter(drop => {
          drop.life -= dt;
          drop.mesh.position.y -= drop.speed * dt;
          if (drop.life <= 0 || drop.mesh.position.y < -0.2) {
            scene.remove(drop.mesh);
            return false;
          }
          return true;
        });

        state.sparks = state.sparks.filter(spark => {
          spark.life -= dt;
          spark.velocity.y -= 9.8 * dt;
          spark.mesh.position.addScaledVector(spark.velocity, dt);
          spark.mesh.material.opacity = Math.max(0, spark.life);
          if (spark.mesh.position.y < 0.65) {
            spark.mesh.position.y = 0.65;
            spark.velocity.y *= -0.25;
            spark.velocity.x *= 0.7;
            spark.velocity.z *= 0.7;
          }
          if (spark.life <= 0) {
            scene.remove(spark.mesh);
            return false;
          }
          return true;
        });
      }

      function updateRobotTag() {
        const farm = currentFarm();
        if (!farm || !farm.robot.mesh) {
          ui.robotTag.style.display = "none";
          return;
        }

        const worldPos = new THREE.Vector3();
        farm.robot.mesh.getWorldPosition(worldPos);
        worldPos.y += 2.9;
        worldPos.project(camera);

        if (worldPos.z > 1) {
          ui.robotTag.style.display = "none";
          return;
        }

        const x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
        const now = performance.now();

        if (farm.robot.brokenUntil > now) {
          ui.robotTag.textContent = `พัง! ${Math.ceil((farm.robot.brokenUntil - now) / 1000)} วิ ⚡`;
        } else if (farm.robot.waterUntil > now) {
          ui.robotTag.textContent = `รดน้ำ 💦 ${Math.ceil((farm.robot.waterUntil - now) / 1000)} วิ`;
        } else {
          ui.robotTag.textContent = "QUIZ 🤖";
        }

        ui.robotTag.style.left = `${x}px`;
        ui.robotTag.style.top = `${y}px`;
        ui.robotTag.style.display = "block";
      }

              <div class="shop-item">
                <strong>${animal.icon} เลี้ยง${animal.name}</strong>
                <small>มี ${amount} ตัว${type === "pig" ? ` · พร้อมขาย ${readyPigs}` : ""}</small>
                <div class="price">ตัวละ ${animal.cost} 🪙</div>
                ${buttonHTML(`ซื้อ${animal.name}`, `animal:${type}`, "buy")}
                ${buttonHTML(`ให้อาหาร 1 ถุง`, `give:${type}`, "buy")}
              </div>
            `;
          });

          html += `
            <div class="shop-item">
              <strong>🐖 ขายหมูโต</strong>
              <small>ขายเฉพาะหมูที่โตเต็มวัย</small>
              <div class="price">ตัวละ 800 🪙</div>
              ${buttonHTML("ขายหมูพร้อมขาย", "sellpigs", "buy")}
            </div>
          `;
        }

        ui.shop.innerHTML = html;

        ui.shop.querySelectorAll("[data-action]").forEach(btn => {
          btn.addEventListener("click", () => {
            const action = btn.dataset.action;
            initAudio();

            if (action.startsWith("seed:")) {
              state.selectedSeed = action.split(":")[1];
              state.activeTab = "seeds";
              floatingText(`เลือก ${PLANTS[state.selectedSeed].name}`, window.innerWidth / 2, window.innerHeight * 0.52, "info");
              renderShop();
            }

            if (action === "plot") buyPlot();
            if (action === "house") upgradeHouse();
            if (action === "barn") buildBarn();

            if (action.startsWith("island:")) {
              buyIsland(action.split(":")[1]);
            }

            if (action === "feed:chickenFeed") buyFeed("chickenFeed", 500);
            if (action === "feed:cowFeed") buyFeed("cowFeed", 1000);
            if (action === "feed:pigFeed") buyFeed("pigFeed", 1200);

            if (action.startsWith("animal:")) buyAnimal(action.split(":")[1]);
            if (action.startsWith("give:")) feedAnimal(action.split(":")[1]);

            if (action === "sellpigs") {
              const farm = currentFarm();
              const ready = farm.animals.pig.filter(p => p.readyToSell);
              if (!ready.length) {
                floatingText("ยังไม่มีหมูโตพร้อมขาย", window.innerWidth / 2, window.innerHeight * 0.42, "info");
                return;
              }

              farm.animals.pig = farm.animals.pig.filter(p => !p.readyToSell);
              state.coins += ready.length * 800;
              rebuildFarm(farm);
              sound("money");
              floatingText(`ขายหมู ${ready.length} ตัว +${ready.length * 800} 🪙`, window.innerWidth / 2, window.innerHeight * 0.42, "good");
              updateUI();
            }
          });
        });
      }

      function switchIsland(farm) {
        const index = state.islands.indexOf(farm);
        if (index < 0 || index === state.activeIsland) return;
        state.activeIsland = index;
        controls.target.copy(farm.position);
        camera.position.copy(farm.position.clone().add(new THREE.Vector3(17, 18, 24)));
        floatingText(`เข้าสู่${farm.index === 0 ? "เกาะหลัก" : `เกาะ ${farm.index + 1}`}`, window.innerWidth / 2, window.innerHeight * 0.42, "info");
        updateUI();
      }

      function handleWorldClick(event) {
        if (Math.hypot(event.clientX - state.pointerDown.x, event.clientY - state.pointerDown.y) > 6) return;
        if (ui.modal.classList.contains("show")) return;

        initAudio();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const targets = [];
        state.islands.forEach(farm => {
          targets.push(...farm.plotMeshes);
          if (farm.robot.mesh) targets.push(farm.robot.mesh);
          if (farm.islandMesh) targets.push(farm.islandMesh);
        });

        const intersections = raycaster.intersectObjects(targets, true);
        if (!intersections.length) return;

        let object = intersections[0].object;
        while (object && !object.userData.kind) object = object.parent;
        if (!object) return;

        const data = object.userData;

        if (data.kind === "island") {
          switchIsland(data.farm);
          return;
        }

        if (data.kind === "robot") {
          switchIsland(data.farm);
          askQuiz(data.farm);
          return;
        }

        if (data.kind === "plot") {
          switchIsland(data.farm);
          const crop = data.farm.plots[data.index].crop;
          if (!crop) {
            plantCrop(data.farm, data.index, event.clientX, event.clientY);
          } else if (crop.ready) {
            harvestCrop(data.farm, data.index, event.clientX, event.clientY);
          } else {
            const p = Math.floor((crop.elapsed / PLANTS[crop.type].grow) * 100);
            floatingText(`กำลังโต ${p}% 🌱`, event.clientX, event.clientY, "info");
            sound("wrong");
          }
        }
      }

      ui.sell.addEventListener("click", () => {
        initAudio();
        sellEverything();
      });

      renderer.domElement.addEventListener("pointerdown", event => {
        state.pointerDown.x = event.clientX;
        state.pointerDown.y = event.clientY;
      });

      renderer.domElement.addEventListener("pointerup", handleWorldClick);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      initialWorld();
      updateUI();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.1);
        const elapsed = clock.elapsedTime;

        updateWaterAndEffects(dt, elapsed);
        state.islands.forEach(farm => updateFarm(farm, dt, elapsed));
        updateRobotTag();
        controls.update();
        renderer.render(scene, camera);

        if (Math.floor(elapsed * 4) % 4 === 0) {
          updateUI();
        }
      }

      animate();
    })();
  </script>
</body>
</html>
